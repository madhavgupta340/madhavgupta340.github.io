<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-name" href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>
      <span class="pixel-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>{{ site.author.name }}
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        {% for item in site.data.navigation %}
          {% assign is_current = false %}
          {% if page.url == item.url %}{% assign is_current = "page" %}{% elsif page.url contains item.url %}{% assign is_current = "true" %}{% endif %}
          <li><a href="{{ item.url | relative_url }}"{% if is_current %} aria-current="{{ is_current }}"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
